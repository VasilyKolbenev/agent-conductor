name: CI
on:
  push:
    branches: [qa/macos-editor-repro-1127]
permissions:
  contents: read
jobs:
  reproduce:
    name: Focused editor boot in reverse gate on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Replay reverse neighbors and editor startup
        run: python -m browser_tests.qa_editor_reverse
      - name: Keep gate diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-macos-editor
          path: |
            ${{ runner.temp }}/editor-repro/*/*.json
            ${{ runner.temp }}/editor-repro/*/*.txt
            ${{ runner.temp }}/editor-repro/*/*.png
            ${{ runner.temp }}/editor-repro/*/chromium/*.log
