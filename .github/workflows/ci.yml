name: CI

# Three platforms, and the reason is not breadth for its own sake. This product
# spawns and owns child processes, and the primitives it owns them WITH are the
# operating system's own: a Job Object on Windows, a process/session group on
# POSIX. A green Ubuntu job says nothing about either of the other two, and
# "POSIX" is not one platform — macOS is not proved by Linux.
#
# Nothing here may be read as a release gate until these jobs have really run on
# GitHub's runners. A workflow file is a statement of intent; the results are the
# evidence.

on:
  push:
  pull_request:

jobs:
  test:
    name: tests ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The `browser` extra is installed in the CORE job, and it is not a stray
      # dependency: `testpaths` is `tests/`, and `tests/test_browser_gate.py`
      # imports `browser_tests.conftest`, which imports `playwright.sync_api` at
      # module level. Without the package the fast suite cannot be COLLECTED --
      # remote run #8 lost all six core jobs to `ModuleNotFoundError` before a
      # single product test ran, on three platforms at once.
      #
      # The PACKAGE only. No `playwright install` here: nothing in the fast
      # suite launches an engine -- the gate's own tests drive a recording fake
      # -- so downloading Chromium into six jobs would buy nothing.
      - name: Install
        run: python -m pip install -e ".[dev,browser]"

      # The interpreter and the console-script directory are printed because a
      # Windows runner keeps them APART: `setup-python` installs no virtualenv,
      # so `sys.executable` sits in the install root and the scripts sit in
      # `Scripts` one level down. `tests/_fakeexe.py` searched only the first
      # and found no launcher, so 277 tests across four provider transport
      # suites skipped here while this job stayed green. Printed so a reader of
      # a future log can see which layout produced the numbers below it.
      - name: Interpreter layout
        run: |
          python -c "import sys, sysconfig; print('executable:', sys.executable)"
          python -c "import sysconfig; print('scripts:', sysconfig.get_path('scripts'))"

      - name: Tests
        run: python -m pytest -q

      - name: Mutation harness
        run: python scripts/mutate_merge.py

      - name: Demo drift gate
        run: >
          python -c "import sys, tempfile;
          from conductor import demo;
          from conductor.__main__ import main;
          sys.exit(main(['validate', '--dir', str(demo.materialize(tempfile.mkdtemp()))]))"

      - name: Wheel smoke
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip uninstall -y agent-conductor
          python -m pip install --no-index --find-links dist agent-conductor --force-reinstall --no-deps
          python -c "from conductor import schema, merge, store, prompts, server, demo"
          demo_dir=$(python -c "import tempfile; from conductor import demo; print(demo.materialize(tempfile.mkdtemp()))")
          conduct validate --dir "$demo_dir"

      # Fail-closed, and LAST, because everything above it can write. A job that
      # leaves a file in the checkout and still reports green is a gate saying
      # nothing about what it did: the next reader cannot tell a build artefact
      # from a test that wrote where it should not, and on one platform out of
      # three it would go unnoticed entirely. Ignored paths are excluded by
      # `git status` itself, so `dist/`, `build/` and the egg-info the editable
      # install writes do not count as dirt.
      - name: The checkout is clean
        run: |
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "this job left the checkout dirty:"
            echo "$dirty"
            git diff --stat
            exit 1
          fi

  browser:
    name: browser gate ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[browser]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # RUNNER_TEMP, never the worktree. The gate hands each module its own
      # basetemp inside this directory and names Chromium's own log file there
      # too; a browser writing beside the checkout would leave engine logs and
      # profiles inside the tree under test, where the next step would read them
      # as part of the product.
      - name: Browser gate
        run: python browser_tests/gate.py --artifacts "$RUNNER_TEMP/browser-gate"

      # The same modules in the opposite order. The recurring Chromium flake was
      # order-sensitive, and a gate that only ever ran one order could not say
      # whether a module passed on its own merits or on its neighbour's state.
      - name: Browser gate, reversed
        run: >
          python browser_tests/gate.py --reverse
          --artifacts "$RUNNER_TEMP/browser-gate-reverse"

      # The same fail-closed check, and the browser job needs it MORE: a browser
      # writes profiles, caches and its own engine log wherever it is pointed,
      # and "pointed at the runner temp" is a claim this step is what proves.
      - name: The checkout is clean
        run: |
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "the browser gate left the checkout dirty:"
            echo "$dirty"
            git diff --stat
            exit 1
          fi

      - name: Keep the gate's records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gate-${{ matrix.os }}
          path: ${{ runner.temp }}/browser-gate*
          if-no-files-found: warn
          retention-days: 14

  # ONE wheel, built once, is what the installed road walks everywhere. It is pure
  # py3-none-any, so the same bytes install on every platform; a wheel built per
  # runner would be a different archive per platform and prove nothing about the
  # one selected. Its sha256 travels with it, and the road refuses any other bytes.
  wheel:
    name: build one wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"

      - name: Digest
        id: digest
        run: |
          set -- "$RUNNER_TEMP"/dist/*.whl
          if [ "$#" -ne 1 ]; then echo "expected one wheel, found $#"; exit 1; fi
          digest=$(python -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$1")
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: The checkout is clean
        run: |
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "the wheel build left the checkout dirty:"
            echo "$dirty"
            exit 1
          fi

      - name: Keep the wheel
        uses: actions/upload-artifact@v4
        with:
          name: candidate-wheel
          path: ${{ runner.temp }}/dist/*.whl
          if-no-files-found: error
          retention-days: 14

  # The installed road on POSIX, from that one wheel: a clean venv, the wheel alone
  # offline, provenance under -I, init -> ownership activate -> two `conduct up`
  # lifetimes, each stopped by SIGINT to its own process group and followed by
  # `closed` ownership. Windows walks the same road with a console Ctrl+C, which
  # needs its own runner; docs/release-smoke.md says where. Only the report and
  # the per-command logs are kept -- never the venv, the project or the wheel copy.
  wheel-road:
    name: installed wheel road ${{ matrix.os }}
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: candidate-wheel
          path: ${{ runner.temp }}/dist

      - name: Installed wheel road
        run: >
          python scripts/wheel_road.py
          --wheel "$(ls "$RUNNER_TEMP"/dist/*.whl)"
          --sha256 "${{ needs.wheel.outputs.sha256 }}"
          --work "$RUNNER_TEMP/wheel-road"

      - name: The checkout is clean
        run: |
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "the installed road left the checkout dirty:"
            echo "$dirty"
            exit 1
          fi

      - name: Keep the road's records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-road-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/wheel-road/report.json
            ${{ runner.temp }}/wheel-road/*.log
          if-no-files-found: warn
          retention-days: 14
