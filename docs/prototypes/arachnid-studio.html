<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arachnid Studio · Макет рабочего места</title>
<style>
* { box-sizing: border-box }
:root { color-scheme: dark; font: 15px/1.5 "Segoe UI",sans-serif; color: #e9eeed; background: #121716 }
body { margin: 0 }
header, nav, main, aside { min-width: 0 }
header { height: 58px; display:flex; align-items:center; gap:14px; border-bottom:1px solid #34403c; padding:0 20px }
header strong { font-size:20px; letter-spacing:-.04em }
small, .muted { color:#a1afa9 }
header small { margin-left:auto }
button,input { font:inherit }
button { color:inherit; background:#25312d; border:1px solid #44544c; border-radius:7px; padding:7px 12px; cursor:pointer }
button:focus-visible,input:focus-visible { outline:2px solid #c3ee99; outline-offset:2px }
#layout { display:grid; grid-template-columns: 218px minmax(0,1fr); min-height:calc(100dvh - 58px) }
#layout.details { grid-template-columns:218px minmax(0,1fr) minmax(260px,28%) }
nav,aside { background:#18201d; padding:20px 14px }
nav { border-right:1px solid #34403c }
nav button { width:100%; text-align:left; border:0; background:transparent; margin:2px 0 }
nav button[aria-current=true] { background:#303c32; color:#d5efa9 }
nav h2,aside h2 { font-size:13px; font-weight:600; color:#b2c1b7 }
main { padding:clamp(16px,4vw,56px); display:flex; flex-direction:column; gap:12px }
main h1 { margin:0; font-size:clamp(24px,3.4vw,42px); line-height:1.15; letter-spacing:-.04em }
#messages { flex:1 }
article { max-width:690px; margin:24px 0 }
article p,aside p { margin:5px 0 12px; white-space:pre-line }
article.mine { padding:12px 16px; border-radius:10px; background:#243029; margin-left:auto; max-width:560px }
.tools { display:flex; gap:6px; flex-wrap:wrap }
form { display:flex; gap:8px; margin-top:20px }
input { min-width:0; flex:1; background:#1c2621; color:inherit; border:1px solid #596c60; border-radius:8px; padding:12px }
form button { background:#c3e99d; border-color:#c3e99d; color:#172417 }
aside { border-left:1px solid #34403c }
aside > button { float:right }
#menu { display:none }
[hidden] { display:none !important }
@media(max-width:760px) {
 #layout, #layout.details { display:block }
 #menu { display:block }
 nav { display:none }
 nav.open { display:block }
 main { min-height:calc(100dvh - 58px) }
 aside { position:fixed; inset:58px 0 0; overflow:auto }
 header small { font-size:11px }
}
</style>
<header><button id="menu" aria-controls="sessions" aria-expanded="false">Сессии</button><strong>Arachnid</strong><span>Studio</span><small>Макет · учебные данные</small></header>
<div id="layout">
<nav id="sessions" aria-label="История"><h2>Сессии и задачи</h2></nav>
<main><span class="muted">Оркестратор</span><h1 id="title"></h1><section id="messages" aria-live="polite"></section>
<div class="tools"><button data-panel="Grok">Открыть Grok</button><button data-panel="Codex">Открыть Codex</button><button data-panel="Лимиты">Лимиты</button><button data-panel="Память">Память</button></div>
<form><input id="command" aria-label="Сообщение оркестратору" placeholder="Написать оркестратору…"><button>Отправить</button></form></main>
<aside hidden aria-label="Детали по запросу"><button id="close">Закрыть</button><h2 id="panelTitle"></h2><p id="panelText"></p></aside></div>
<script>
const get = id => document.getElementById(id);
const tasks = [
 {title:"Исправить счётчик", question:"Счётчик включает неудачные запуски. Найди причину и исправь.", answer:"Предлагаю цикл Далио. Grok проведёт диагностику. Codex подготовит правку, отдельный экземпляр Codex проверит изменённые файлы. Перед исполнением покажу план и границы.", memory:"Критерий этой задачи: считать только успешные запуски. Источник — первое сообщение оператора."},
 {title:"Проверить отчёт", question:"Проверь итог за неделю.", answer:"Проверка завершена. Итог по пяти запускам согласован. Решение сохранено в этой сессии.", memory:"В итог включаются принятые результаты за неделю. Источник — решение из сессии «Проверить отчёт»."}
];
let current=0, previousControl=null;
const aside=document.querySelector("aside");
function select(i) {
 current=i; hide(false); get("title").textContent=tasks[i].title;
 get("messages").replaceChildren();
 for(const [name,text] of [["Вы",tasks[i].question],["Оркестратор",tasks[i].answer]]) {
   const article=document.createElement("article"), author=document.createElement("strong"), message=document.createElement("p");
   if(name==="Вы") article.className="mine";
   author.textContent=name; message.textContent=text; article.append(author,message); get("messages").append(article);
 }
 document.querySelectorAll("nav button").forEach((b,n)=>b.setAttribute("aria-current",String(n===i)));
 get("sessions").classList.remove("open"); get("menu").setAttribute("aria-expanded","false"); get("command").value="";
}
function hide(restore=true) {
 aside.hidden=true; get("layout").classList.remove("details"); if(restore && previousControl) previousControl.focus();
}
function panel(name, control) {
 const texts={
   Grok:current===0?"Диагност · чтение файлов\n\nЗадача участника — выяснить, почему учитывается неудачный запуск.":"В этой сессии Grok не назначен.",
   Codex:current===0?"Исполнитель · шаг Do\n\nОжидает плана и разрешения. Проверяющий увидит снимок фактических изменений.":"Проверяющий · результат принят.",
   Лимиты:"Данные квот в макете не загружаются.\n\nCodex — нет показаний.\nGrok — нет показаний.",
   Память:tasks[current].memory
 };
 previousControl=control; get("panelTitle").textContent=name; get("panelText").textContent=texts[name]; aside.hidden=false;
 get("layout").classList.add("details"); get("close").focus();
}
tasks.forEach((t,i)=>{const b=document.createElement("button"); b.textContent=t.title; b.onclick=()=>select(i); get("sessions").append(b)});
document.querySelectorAll("[data-panel]").forEach(b=>b.onclick=()=>panel(b.dataset.panel,b));
get("close").onclick=()=>hide(); document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!aside.hidden) hide()});
get("menu").onclick=()=>get("menu").setAttribute("aria-expanded",String(get("sessions").classList.toggle("open")));
document.querySelector("form").onsubmit=e=>{
 e.preventDefault();const input=get("command"), text=input.value.trim().toLowerCase();
 const key=[["лимит","Лимиты"],["памят","Память"],["grok","Grok"],["codex","Codex"]].find(([prefix])=>text.includes(prefix));
 if(key){panel(key[1],input);input.value="";return}
 input.setCustomValidity("В макете доступны команды «покажи лимиты», «память», «Grok» и «Codex».");input.reportValidity();input.setCustomValidity("");
};
select(0);
</script>
</html>
