<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">December Command</title>
  <desc id="desc">Your coding agents. One clear workflow. A green orbital motif connects participants around a shared center.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111c16"/><stop offset="1" stop-color="#0c100f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#78914f" stop-opacity=".2"/><stop offset="1" stop-color="#78914f" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#2e3b32"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="76" fill="#b6c9a0" font-size="13" letter-spacing="3">LOCAL / OPEN SOURCE / HUMAN CONTROL</text>
    <text x="60" y="153" fill="#eff4e9" font-size="59" font-weight="650" letter-spacing="-2">December Command</text>
    <text x="64" y="207" fill="#c3d0c6" font-size="25">Your coding agents. One clear workflow.</text>
    <path d="M64 249 H118" stroke="#d4f99b" stroke-width="3"/>
    <text x="136" y="255" fill="#a3b1a9" font-size="16">Plan. Run. Check. Decide.</text>
    <text x="64" y="316" fill="#839187" font-size="12" letter-spacing="2">DECEMBER / V1 ALPHA</text>
  </g>
  <circle cx="1040" cy="179" r="179" fill="url(#glow)"/>
  <g fill="none" stroke="#42523d">
    <ellipse cx="1040" cy="179" rx="163" ry="102" transform="rotate(-25 1040 179)"/>
    <ellipse cx="1040" cy="179" rx="130" ry="65" transform="rotate(35 1040 179)" stroke-dasharray="5 9"/>
    <circle cx="1040" cy="179" r="50" stroke="#78914f"/>
  </g>
  <circle cx="1040" cy="179" r="24" fill="#d4f99b"/>
  <circle cx="1040" cy="179" r="8" fill="#263623"/>
  <g fill="#17241b" stroke="#b6cf8a" stroke-width="2">
    <circle cx="891" cy="184" r="12"/>
    <circle cx="1030" cy="66" r="12"/>
    <circle cx="1181" cy="128" r="12"/>
    <circle cx="1126" cy="251" r="12"/>
    <circle cx="953" cy="280" r="12"/>
