[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-conductor"
version = "0.1.0"
description = "December Command alpha: a local, decision-centric control plane for heterogeneous AI coding harnesses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vasily Kolbenev" }]
keywords = ["agents", "ai", "orchestration", "observability", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["pytest>=8", "playwright>=1.54,<2", "pillow>=10,<13"]

[project.scripts]
conduct = "conductor.__main__:main"

[project.urls]
Repository = "https://github.com/VasilyKolbenev/agent-conductor"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
